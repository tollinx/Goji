services:
  - type: web
    name: kurai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: https://kurai-frontend.vercel.app,http://localhost:5173
