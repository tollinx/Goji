<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goji &amp; Gin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Stamp the theme before first paint so the page never flashes the wrong
      // one. useTheme takes over from here and keeps this attribute in sync.
      (function () {
        try {
          var stored = localStorage.getItem('goji-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
